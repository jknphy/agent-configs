# Preferred agents (e.g. claude, gemini, copilot, opencode, antigravity, hermes)
AGENTS=pi

# pi settings.json managed on the host (applied by glaipnir/hooks/10-pi-settings.sh)
RO_MOUNTS=(
    /home/jrivera/Code/agent-configs/pi-settings:/home/aiuser/pi-config:ro
)

# Host commands the sandbox may run. Plain git (add/commit/log/...) works inside
# the sandbox itself; only push + PR go through the host, via agent-pr, which pins
# repo, branch and SSH key (see glaipnir/agent-pr/ and README). Never allowlist
# `git push` here: it would run on the host with your credentials and any remote.
CMDS=(
    "agent-pr"
)
